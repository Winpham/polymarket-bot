# Minimal deploy for the CONSENSUS engine only: Postgres + the copy-trading-bot
# built from THIS branch's source (not the upstream GHCR image). Alert/paper-only.
#
#   1. cp .env.consensus.example .env.consensus  &&  edit in your Telegram creds
#   2. docker compose -f docker-compose.consensus.yml --env-file .env.consensus up -d --build
#   3. logs:  docker compose -f docker-compose.consensus.yml logs -f copy-trading-bot
#
# Postgres data persists in the `pgdata` volume across restarts (the forward
# record the promotion gate accrues). Metrics on http://localhost:9001/metrics.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d polymarket"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  copy-trading-bot:
    build:
      context: .
      dockerfile: Dockerfile.consensus
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bot:bot@postgres:5432/polymarket
      # ntfy phone push — reuses your brainstem channel (alerts buzz your phone).
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env.consensus (your brainstem ntfy topic)}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      BOARD_PORT: "9002"
      METRICS_PORT: "9001"
      # L1: every-minute cadence + incremental delta ingestion (poll only the
      # delta since each trader's cursor; rebuild books from the stored window).
      CONSENSUS_INTERVAL_MINS: "1"
      CONSENSUS_INCREMENTAL: "true"
      RUST_LOG: "copy_trading_bot=info,polymarket_common=warn"
      # --- market_resid (price-free residual arm) lifecycle; set these in
      #     .env.consensus. Accrual is safe/additive; the arm stays default-OFF. ---
      MARKET_FEATURE_LOG: ${MARKET_FEATURE_LOG:-false}        # forward 29-feature log accrual
      MARKET_PREFETCH_MAX: ${MARKET_PREFETCH_MAX:-200}        # cap distinct strict markets prefetched/cycle
      CONSENSUS_ARM_RESID: ${CONSENSUS_ARM_RESID:-false}      # enable the silent market_resid arm
      CONSENSUS_ML_MARGIN: ${CONSENSUS_ML_MARGIN:-0.0}        # legacy market arms: p − mid > margin
      MARKET_RESID_MARGIN: ${MARKET_RESID_MARGIN:-0.0}        # resid arm's OWN knob: p_cons − band_rate > margin
      MARKET_RESID_TRAINED_THROUGH: ${MARKET_RESID_TRAINED_THROUGH:-}  # else the model's meta.json
      # --- honest P&L tracker (read-only; CLV − execution haircut, multi-regime).
      #     All read-only analytics knobs; none touch selection/alerting/betting. ---
      EXEC_HAIRCUT: ${EXEC_HAIRCUT:-0.01}                     # buy-side haircut (price units) when no real ask
      FLAT_STAKE: ${FLAT_STAKE:-100.0}                        # paper stake $/bet (capacity ceiling)
      CAPACITY_FRAC: ${CAPACITY_FRAC:-0.05}                   # usable fraction of median sharp $
      MIN_PILOT_ROI: ${MIN_PILOT_ROI:-0.02}                   # corrected honest-ROI LB bar for a GO
      PILOT_MIN_EVENTS: ${PILOT_MIN_EVENTS:-50}               # distinct-event floor for a GO
      PILOT_MIN_REGIMES: ${PILOT_MIN_REGIMES:-5}              # min positive day-regimes for a GO
      REGIME_FRAC: ${REGIME_FRAC:-0.7}                        # fraction of regimes that must be positive
      MIN_LIQUIDITY_USD: ${MIN_LIQUIDITY_USD:-2000.0}         # liquidity floor (median sharp $) for a GO
      CAPTURE_ENTRY_ASK: ${CAPTURE_ENTRY_ASK:-false}          # capture real CLOB best-ask (else mid+haircut)
      ENTRY_ASK_MAX_PER_CYCLE: ${ENTRY_ASK_MAX_PER_CYCLE:-40} # cap LAGGED backlog book-ask fetches/cycle
      ENTRY_ASK_DECISION_MAX_PER_CYCLE: ${ENTRY_ASK_DECISION_MAX_PER_CYCLE:-40} # cap DECISION-TIME (first-price) fetches/cycle
      REALIZED_DECISION_LAG_SECS: ${REALIZED_DECISION_LAG_SECS:-900.0} # entry_ask_at−first_detected_at ≤ this ⇒ decision-time (realized ROI)
      LEDGER_STRATEGIES: ${LEDGER_STRATEGIES:-}               # paper ledger scope (empty = all non-blind)
      HONEST_DIGEST: ${HONEST_DIGEST:-false}                  # opt-in phone digest (material-change only)
      HONEST_MAX_DRAWDOWN_USD: ${HONEST_MAX_DRAWDOWN_USD:-500.0} # paper-drawdown breach floor for the digest
      # Telegram is OPTIONAL — leave unset for ntfy-only (this deploy).
      # TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # --- deep-leaderboard ingestion (feat/deep-leaderboard). Widen CAPTURE via
      #     offset pagination; the voter set stays rank ≤ cutoff (= today's top-40),
      #     so raising depth is byte-for-byte non-regressive for consensus. ---
      TRACK_DEPTH: ${TRACK_DEPTH:-40}                          # >50 paginates; deep ranks captured+profiled, not voting
      TRACK_CONSENSUS_RANK_CUTOFF: ${TRACK_CONSENSUS_RANK_CUTOFF:-40} # rank ≤ this votes; deeper is candidate-only
      TRACK_COHORT_BANDS: ${TRACK_COHORT_BANDS:-40,100,250,500}       # observatory rank bands (display/filter only)
      # --- winner alerting (D10): which strategies push, and whether their
      #     WATCH-tier (net=3) fires push too. Defaults = incumbent behavior. ---
      CONSENSUS_ALERT_STRATEGIES: ${CONSENSUS_ALERT_STRATEGIES:-}   # empty = built-in flags (strict only)
      CONSENSUS_ALERT_WATCH_FOR: ${CONSENSUS_ALERT_WATCH_FOR:-}     # empty = WATCH never pushes
      CONSENSUS_ALERT_CROSS_DEDUP_MINS: ${CONSENSUS_ALERT_CROSS_DEDUP_MINS:-60} # one push per market across strategies
      # --- deep-pool edge run (feat/deep-edge): earned deep-sharp eligibility +
      #     trust/tail arms. ALL default to today's behavior when unset. The trust
      #     arms are SILENT (never alert); EARN_DEEP_SHARPS=false keeps promotion
      #     report-only ("promotable" on the board, no eligibility flips). ---
      CONSENSUS_TRUST_ARMS: ${CONSENSUS_TRUST_ARMS:-false}   # register trust/cross-cohort/tail arms + hourly trust map
      PROVEN_ROUTER: ${PROVEN_ROUTER:-false}           # proven-trader router arm + follow-set re-scorer (PREREG 2026-07-04, paper-only)
      TRUST_REFRESH_MINS: ${TRUST_REFRESH_MINS:-60}          # trust-map (and earn-pass) cadence
      EARN_DEEP_SHARPS: ${EARN_DEEP_SHARPS:-false}           # flip earned_eligible for gate-Trusted deep sharps
      CONSENSUS_RETUNED: ${CONSENSUS_RETUNED:-}              # "min_backers,strong_net,elite_net" silent strict variant
      # --- dense early-life capture (decay Phase 0): sub-5-min trajectory for
      #     fresh actionable signals; OFF = loop never spawned. ---
      DENSE_CAPTURE: ${DENSE_CAPTURE:-false}
      DENSE_INTERVAL_SECS: ${DENSE_INTERVAL_SECS:-45}
      DENSE_WINDOW_MINS: ${DENSE_WINDOW_MINS:-15}
      DENSE_MAX_SIGNALS: ${DENSE_MAX_SIGNALS:-40}
      DENSE_STRATEGIES: ${DENSE_STRATEGIES:-strict,favorite,elite_fresh_fav}
      # --- optional consensus tuning (sensible defaults baked in) ---
      # TRACK_TOP_N: "40"
      # TRACK_PERIODS: "WEEK,MONTH"
      # CONSENSUS_STRATEGIES: ""   # empty = all 14 strategies run
    ports:
      - "9001:9001"   # Prometheus metrics
      - "9002:9002"   # read-only web scoreboard
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
